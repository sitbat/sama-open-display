[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sama-open-display"
version = "0.9.0"
description = "Open-source tool for displaying custom content on SAMA screen devices"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "SAMA Open Display contributors" }]
dependencies = [
    "Pillow>=10",
    "psutil>=5.9",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
build = ["pyinstaller>=6"]

[project.scripts]
sama-display = "sama_display.cli:main"
sama-display-gui = "sama_display.app:main"

[tool.setuptools]
packages = ["sama_display"]
