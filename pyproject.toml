[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sama-open-display"
version = "0.7.1"
description = "SamaRP open-source remastering project for the SAMA 6.5-inch USB display"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "SamaRP contributors" }]
dependencies = [
    "Pillow>=10",
    "psutil>=5.9",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
video = ["opencv-python>=4.8"]
build = ["pyinstaller>=6"]

[project.scripts]
sama-display = "sama_display.cli:main"
sama-display-gui = "sama_display.app:main"

[tool.setuptools]
packages = ["sama_display"]
